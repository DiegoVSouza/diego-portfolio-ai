<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Atelier: models, camera and world</title>
    <style>
      :root { color-scheme: dark; --bg: #0c0c0c; --panel: #161616; --line: #333; --ink: #eee; --dim: #999; --red: #e4122a; font: 13px/1.4 ui-monospace, Consolas, monospace; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); height: 100vh; display: grid; grid-template-columns: 340px 1fr; }
      aside { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
      main { position: relative; min-width: 0; }
      h1 { font-size: 14px; margin: 0; letter-spacing: 0.08em; text-transform: uppercase; color: var(--red); }
      .tabs { display: flex; gap: 6px; }
      button, select, input[type="text"] { background: #222; color: var(--ink); border: 1px solid var(--line); padding: 5px 8px; font: inherit; cursor: pointer; }
      button.on { background: var(--red); border-color: var(--red); }
      label { display: grid; grid-template-columns: 1fr 70px; gap: 4px 8px; align-items: center; color: var(--dim); }
      label input[type="range"] { grid-column: 1 / -1; width: 100%; }
      label output { text-align: right; color: var(--ink); }
      fieldset { border: 1px solid var(--line); margin: 0; padding: 8px; display: grid; gap: 6px; }
      legend { color: var(--dim); padding: 0 4px; }
      pre { margin: 0; white-space: pre-wrap; color: var(--dim); }
      .bad { color: #ffb347; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; }
      #view { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
      /* The scene is laid out for a 1280 x 800 screen: show it at that size, scaled down to fit. */
      #preview { position: absolute; top: 0; left: 0; width: 1280px; height: 800px; border: 0; transform-origin: 0 0; }
      #world { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
      #world-list { max-height: 260px; overflow: auto; display: grid; gap: 2px; }
      #world-list button { text-align: left; padding: 2px 6px; }
      #world-list button.edited { color: #ffd23c; }
      #world-list button.hidden { color: #ff6b6b; text-decoration: line-through; }
      #world-list button.sel { background: var(--red); color: var(--ink); }
      [hidden] { display: none !important; }
      textarea { width: 100%; height: 120px; background: #111; color: var(--ink); border: 1px solid var(--line); font: inherit; }
    </style>
  </head>
  <body>
    <aside>
      <h1>Atelier</h1>
      <div class="tabs">
        <button id="tab-models" class="on">Models</button>
        <button id="tab-camera">Camera</button>
        <button id="tab-world">World</button>
      </div>
      <section id="models"></section>
      <section id="camera" hidden></section>
      <section id="world-panel" hidden></section>
    </aside>
    <main>
      <canvas id="view"></canvas>
      <iframe id="preview" title="Scene preview" hidden></iframe>
      <iframe id="world" title="World editor" hidden></iframe>
    </main>
    <script type="module" src="/src/atelier/main.ts"></script>
  </body>
</html>
